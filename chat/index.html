<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>Sexta · Assistente</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#0b0f17;--card:#141b27;--line:#233044;--tx:#e6edf6;--mu:#8a9bb3;--ac:#21c7ff;--me:#1d4ed8}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
header b{font-size:18px;letter-spacing:.5px}header b span{color:var(--ac)}
.dot{width:9px;height:9px;border-radius:50%;background:#f43f5e}.dot.on{background:#22c55e}
header .sp{flex:1}
.hb{background:none;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:7px 10px;font-size:14px}
#log{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.sys{align-self:center;color:var(--mu);font-size:13px;text-align:center;max-width:95%}
.act{display:inline-block;margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--ac);color:#001018;font-weight:600;text-decoration:none;border:0;font-size:14px}
.meta{font-size:11px;color:var(--mu);margin-top:4px}
#chips{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px}
#chips button{flex:none;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:6px 12px;font-size:13px}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#in{flex:1;min-height:44px;max-height:130px;resize:none;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:22px;padding:11px 15px;font:inherit}
.rb{width:46px;height:46px;border-radius:50%;border:0;font-size:20px;color:#fff;background:var(--card);border:1px solid var(--line)}
#send{background:var(--ac);color:#001018;border:0}
#mic.rec{background:#f43f5e;animation:p 1s infinite}@keyframes p{50%{opacity:.6}}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:14px;width:min(92vw,420px)}
dialog input,dialog select{width:100%;padding:10px;margin:6px 0 12px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;font:inherit}
dialog::backdrop{background:rgba(0,0,0,.7)}
label.ck{display:flex;gap:8px;align-items:center;margin-bottom:12px}label.ck input{width:auto;margin:0}
small{color:var(--mu)}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span><b>SEXTA<span>·</span>IA</b><span class="sp"></span>
  <button class="hb" id="voz" title="Voz">🔊</button>
  <button class="hb" onclick="limpar()">Limpar</button>
  <button class="hb" onclick="cfg.showModal()">⚙︎</button>
</header>
<div id="log"></div>
<div id="chips">
  <button>O que você sabe fazer?</button><button>Toca lofi no YouTube</button><button>Timer de 5 minutos</button>
  <button>Anota: comprar pão</button><button>Minhas notas</button><button>Quanto é 15% de 280?</button><button>Como chego em Montes Claros?</button>
</div>
<form id="f">
  <button type="button" class="rb" id="mic" title="Falar">🎤</button>
  <textarea id="in" rows="1" placeholder="Fale ou digite..."></textarea>
  <button class="rb" id="send" title="Enviar">➤</button>
</form>

<dialog id="cfg">
  <h3 style="margin-top:0">Configurar</h3>
  <small>Chave da GroqCloud (começa com gsk_). Crie grátis em console.groq.com/keys. Fica salva só neste aparelho.</small>
  <input id="key" type="password" placeholder="gsk_..." autocomplete="off">
  <small>Seu nome (opcional)</small>
  <input id="nome" placeholder="Como te chamo?">
  <label class="ck"><input type="checkbox" id="autoAbrir" checked> Abrir links automaticamente</label>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="hb" onclick="cfg.close()">Cancelar</button>
    <button class="hb" style="background:var(--ac);color:#001018" onclick="salvarCfg()">Salvar</button>
  </div>
</dialog>

<script>
const $=id=>document.getElementById(id);
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let KEY=ls.get("sx_key",""),NOME=ls.get("sx_nome",""),AUTO=ls.get("sx_auto",true),VOZ=ls.get("sx_voz",true);
let HIST=ls.get("sx_hist",[]),NOTAS=ls.get("sx_notas",[]);
const LEVE="openai/gpt-oss-20b",POTENTE="openai/gpt-oss-120b";

function atualizaTopo(){$("dot").classList.toggle("on",!!KEY);$("voz").textContent=VOZ?"🔊":"🔇"}
$("voz").onclick=()=>{VOZ=!VOZ;ls.set("sx_voz",VOZ);if(!VOZ)speechSynthesis.cancel();atualizaTopo()};
function salvarCfg(){const k=$("key").value.trim();if(k&&!k.startsWith("gsk_")){alert("A chave da Groq começa com gsk_");return}
  if(k)KEY=k;NOME=$("nome").value.trim();AUTO=$("autoAbrir").checked;ls.set("sx_key",KEY);ls.set("sx_nome",NOME);ls.set("sx_auto",AUTO);cfg.close();atualizaTopo();
  if(KEY)sys("Pronto, estou conectada.")}
$("nome").value=NOME;$("autoAbrir").checked=AUTO;

function bolha(cls,txt,meta){const d=document.createElement("div");d.className="m "+cls;d.textContent=txt;if(meta){const s=document.createElement("div");s.className="meta";s.textContent=meta;d.appendChild(s)}$("log").appendChild(d);$("log").scrollTop=1e9;return d}
function sys(t){const d=document.createElement("div");d.className="sys";d.textContent=t;$("log").appendChild(d);$("log").scrollTop=1e9}
function botao(el,rot,fn){const b=document.createElement("button");b.className="act";b.textContent=rot;b.onclick=fn;el.appendChild(document.createElement("br"));el.appendChild(b)}

function falar(t){if(!VOZ||!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/https?:\S+/g,"").slice(0,600));u.lang="pt-BR";u.rate=1.05;
  const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith("pt")&&/female|fem|Luciana|Francisca/i.test(v.name))||speechSynthesis.getVoices().find(v=>v.lang.startsWith("pt"));if(v)u.voice=v;speechSynthesis.speak(u)}

// ---------- Roteador ----------
function complexidade(t){let s=0;const x=t.toLowerCase();if(t.length>220)s+=2;if(t.length>600)s+=2;
  ["analise","analisa","explique","explica","compare","código","codigo","programa","script","passo a passo","estratégia","plano","redija","escreva um","resuma","resumo","calcule","prove","otimiz","debug","erro no"].forEach(w=>{if(x.includes(w))s+=2});return s}

// ---------- Ações ----------
const ACOES_DESC=`Você pode executar ações no celular do usuário. Para isso, inclua no FIM da resposta uma ou mais linhas exatamente assim:
[[ACAO {"tipo":"...", ...}]]
Tipos disponíveis:
- {"tipo":"abrir","url":"https://..."} abre um site
- {"tipo":"pesquisar","q":"..."} pesquisa no Google
- {"tipo":"youtube","q":"..."} busca/toca no YouTube
- {"tipo":"mapa","destino":"..."} rota no Google Maps
- {"tipo":"whatsapp","texto":"...","numero":"55DDNNNNNNNNN opcional"} abre o WhatsApp com a mensagem pronta
- {"tipo":"email","para":"...","assunto":"...","corpo":"..."}
- {"tipo":"ligar","numero":"..."}
- {"tipo":"timer","segundos":N,"rotulo":"..."}
- {"tipo":"lembrete","em_minutos":N,"texto":"..."}
- {"tipo":"nota_salvar","texto":"..."}
- {"tipo":"nota_listar"}
- {"tipo":"nota_apagar","indice":N}  (N começa em 1; use 0 para apagar todas)
- {"tipo":"copiar","texto":"..."}
Regras: use ação sempre que o pedido for algo para FAZER. Para cálculos e perguntas, responda direto. Não invente que fez algo que não está nessa lista; se pedirem algo impossível (ex.: mexer em configurações do celular, comprar, acessar arquivos), diga com honestidade e ofereça a alternativa mais próxima.`;

function sistema(){const agora=new Date().toLocaleString("pt-BR",{dateStyle:"full",timeStyle:"short"});
  return `Você é a Sexta, assistente pessoal em português do Brasil, inspirada na F.R.I.D.A.Y. dos filmes: direta, calorosa, um pouco espirituosa. Respostas curtas (até 4 frases) a menos que peçam detalhe, porque também são lidas em voz alta. Sem markdown pesado.
Agora: ${agora}. ${NOME?"O usuário se chama "+NOME+".":""}
Notas salvas do usuário: ${NOTAS.length?NOTAS.map((n,i)=>(i+1)+". "+n).join(" | "):"nenhuma"}.
${ACOES_DESC}`}

const timers=[];
function notificar(t){try{if("Notification" in window&&Notification.permission==="granted")new Notification("Sexta",{body:t,icon:"icon.svg"})}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}sys("⏰ "+t);falar(t)}
function pedirNotif(){try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}}

function executar(a,el){const enc=encodeURIComponent;let url=null,rot=null;
  switch(a.tipo){
    case"abrir":url=a.url;rot="Abrir site";break;
    case"pesquisar":url="https://www.google.com/search?q="+enc(a.q||"");rot="Ver pesquisa";break;
    case"youtube":url="https://www.youtube.com/results?search_query="+enc(a.q||"");rot="Abrir YouTube";break;
    case"mapa":url="https://www.google.com/maps/dir/?api=1&destination="+enc(a.destino||"");rot="Abrir rota";break;
    case"whatsapp":url="https://wa.me/"+(a.numero?String(a.numero).replace(/\D/g,""):"")+"?text="+enc(a.texto||"");rot="Enviar no WhatsApp";break;
    case"email":url="mailto:"+(a.para||"")+"?subject="+enc(a.assunto||"")+"&body="+enc(a.corpo||"");rot="Abrir e-mail";break;
    case"ligar":url="tel:"+String(a.numero||"").replace(/[^\d+]/g,"");rot="Ligar";break;
    case"timer":{const s=Math.max(1,+a.segundos||60);pedirNotif();const fim=Date.now()+s*1000;const id=setTimeout(()=>notificar((a.rotulo||"Timer")+" acabou!"),s*1000);timers.push(id);
      const c=document.createElement("div");c.className="meta";el.appendChild(c);const iv=setInterval(()=>{const r=Math.max(0,Math.round((fim-Date.now())/1000));c.textContent="⏱ "+Math.floor(r/60)+":"+String(r%60).padStart(2,"0")+" (mantenha o app aberto)";if(!r)clearInterval(iv)},500);return}
    case"lembrete":{const m=Math.max(0.1,+a.em_minutos||1);pedirNotif();setTimeout(()=>notificar("Lembrete: "+(a.texto||"")),m*60000);const c=document.createElement("div");c.className="meta";c.textContent="🔔 lembrete em "+m+" min (mantenha o app aberto)";el.appendChild(c);return}
    case"nota_salvar":NOTAS.push(String(a.texto||"").slice(0,300));ls.set("sx_notas",NOTAS);addMeta(el,"📝 nota salva ("+NOTAS.length+")");return;
    case"nota_listar":addMeta(el,NOTAS.length?NOTAS.map((n,i)=>(i+1)+". "+n).join("\n"):"Nenhuma nota.");return;
    case"nota_apagar":{const i=+a.indice;if(i===0)NOTAS=[];else if(i>=1&&i<=NOTAS.length)NOTAS.splice(i-1,1);ls.set("sx_notas",NOTAS);addMeta(el,"🗑 notas: "+NOTAS.length);return}
    case"copiar":try{navigator.clipboard.writeText(a.texto||"");addMeta(el,"📋 copiado")}catch(e){botao(el,"Copiar",()=>navigator.clipboard.writeText(a.texto||""))}return;
    default:return}
  if(url&&/^(https?:|mailto:|tel:)/.test(url)){botao(el,rot,()=>window.open(url,"_blank"));
    if(AUTO&&/^https?:/.test(url)){const w=window.open(url,"_blank");if(!w)addMeta(el,"toque no botão para abrir")}}}
function addMeta(el,t){const c=document.createElement("div");c.className="meta";c.style.whiteSpace="pre-wrap";c.textContent=t;el.appendChild(c)}

function extrairAcoes(t){const acoes=[];const limpo=t.replace(/\[\[ACAO\s*(\{[\s\S]*?\})\s*\]\]/g,(m,j)=>{try{acoes.push(JSON.parse(j))}catch(e){}return""}).trim();return{limpo,acoes}}

// ---------- Groq ----------
async function groq(model,msgs){let r;
  try{r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+KEY},
    body:JSON.stringify({model,messages:msgs,temperature:.6,max_tokens:1200,reasoning_effort:"low"})})}catch(e){throw new Error("sem conexão com a Groq, confira a internet")}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){if(j.error?.code==="invalid_api_key")throw new Error("chave inválida. Toque em ⚙︎ e cole de novo");if(r.status===429)throw new Error("limite grátis da Groq atingido, espere um minuto");throw new Error(j.error?.message||"erro "+r.status)}
  return (j.choices?.[0]?.message?.content||"").trim()}

let ocupado=false;
async function enviar(txt){txt=txt.trim();if(!txt||ocupado)return;
  if(!KEY){bolha("u",txt);sys("Preciso da sua chave da Groq primeiro.");cfg.showModal();return}
  ocupado=true;$("send").disabled=true;bolha("u",txt);$("in").value="";autoAltura();
  const el=bolha("a","…");const model=complexidade(txt)>=3?POTENTE:LEVE;const t0=performance.now();
  HIST.push({role:"user",content:txt});
  try{let resp=await groq(model,[{role:"system",content:sistema()},...HIST.slice(-16)]);
    if(!resp)resp=await groq(POTENTE,[{role:"system",content:sistema()},...HIST.slice(-16)]);
    const ms=Math.round(performance.now()-t0);const {limpo,acoes}=extrairAcoes(resp||"Não consegui responder agora, tenta de novo?");
    el.textContent=limpo||"Feito.";addMeta(el,(model===POTENTE?"modelo potente":"modelo leve")+" · "+ms+" ms");
    HIST.push({role:"assistant",content:resp});ls.set("sx_hist",HIST.slice(-40));
    acoes.forEach(a=>executar(a,el));falar(limpo||"Feito.")}
  catch(e){el.textContent="⚠️ "+e.message;HIST.pop()}
  ocupado=false;$("send").disabled=false;$("log").scrollTop=1e9}

function limpar(){if(!confirm("Apagar a conversa? (as notas ficam)"))return;HIST=[];ls.set("sx_hist",[]);$("log").innerHTML="";boasVindas()}

// ---------- Entrada ----------
$("f").onsubmit=e=>{e.preventDefault();enviar($("in").value)};
$("in").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();enviar($("in").value)}});
function autoAltura(){const t=$("in");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,130)+"px"}
$("in").addEventListener("input",autoAltura);
document.querySelectorAll("#chips button").forEach(b=>b.onclick=()=>enviar(b.textContent));

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,gravando=false;
$("mic").onclick=()=>{if(!SR){sys("Seu navegador não tem reconhecimento de voz. Use o Chrome.");return}
  if(gravando){rec.stop();return}
  rec=new SR();rec.lang="pt-BR";rec.interimResults=true;rec.continuous=false;let final="";
  rec.onstart=()=>{gravando=true;$("mic").classList.add("rec");speechSynthesis.cancel()};
  rec.onresult=e=>{let t="";for(const r of e.results){t+=r[0].transcript;if(r.isFinal)final=t}$("in").value=t;autoAltura()};
  rec.onerror=e=>{if(e.error==="not-allowed")sys("Libere o microfone para o site nas permissões do Chrome.")};
  rec.onend=()=>{gravando=false;$("mic").classList.remove("rec");if(final)enviar(final)};
  rec.start()};

function boasVindas(){bolha("a",(NOME?"Oi, "+NOME+"! ":"Oi! ")+"Sou a Sexta. Fale no 🎤 ou digite: abro sites, toco no YouTube, traço rotas, monto mensagens de WhatsApp, marco timers e guardo notas."+(KEY?"":"\n\nToque em ⚙︎ e cole sua chave da Groq pra começar."))}
if(HIST.length){HIST.slice(-12).forEach(m=>{const {limpo}=extrairAcoes(m.content);bolha(m.role==="user"?"u":"a",limpo||"Feito.")})}else boasVindas();
atualizaTopo();if("speechSynthesis" in window)speechSynthesis.getVoices();
</script>
</body>
</html>
